<!DOCTYPE html>
<html class="scroll-smooth" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Code Consortium</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <script type="text/javascript">
      (function() {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== window.location.href) {
          window.history.replaceState(null, null, redirect);
          // The page underneath is the home page; hide it until the right one is drawn.
          document.documentElement.classList.add('spa-redirect');
        }
        // Lets the home page hold its headline back until the intro animation has started.
        document.documentElement.classList.add('js-intro');
      })();
    </script>
    <style>
      .spa-redirect #root { visibility: hidden; }
      /* The intro shows the block itself; if it never runs, the block appears after 2.5 s anyway. */
      @media (prefers-reduced-motion: no-preference) {
        .js-intro [data-intro] { opacity: 0; animation: tcc-intro-failsafe 0s 2.5s forwards; }
      }
      @keyframes tcc-intro-failsafe { to { opacity: 1; } }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  </head>
  <body class="bg-gray-50 text-black font-sans antialiased overflow-x-hidden selection:bg-black selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
